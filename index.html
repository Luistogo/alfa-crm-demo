<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Alfa CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: web de escritorio con menú lateral y contenido a lo ancho; ficha y alta por secciones desplegables; por debajo de 820px el menú pasa a barra inferior y todo se apila */
:root {
  --bg: #f2f5f7;
  --side: #10303a;
  --side-ink: #d7e6ea;
  --side-muted: #8fb0b9;
  --side-on: #1b4955;
  --surface: #ffffff;
  --bar: #e3e8eb;
  --ink: #15202a;
  --muted: #5d6b77;
  --line: #dbe1e6;
  --accent: #0f5c6e;
  --on-accent: #ffffff;
  --accent-soft: #e0eef1;
  --warn: #b86e00;
  --warn-soft: #fcefd6;
  --bad: #b3383a;
  --bad-soft: #f9e2e2;
  --good: #3f8f3a;
  --good-soft: #def2e4;
  --scrim: rgba(12, 20, 26, .45);
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171d; --side: #0b1f26; --side-ink: #d7e6ea; --side-muted: #7d9ba4; --side-on: #17343d;
    --surface: #182129; --bar: #222d36; --ink: #e4eaee; --muted: #97a6b2; --line: #28343e;
    --accent: #5db4c6; --on-accent: #08262e; --accent-soft: #15343d; --warn: #f0a53a; --warn-soft: #3a2a12;
    --bad: #ec7f7f; --bad-soft: #3b1e1f; --good: #74c66c; --good-soft: #17331f; --scrim: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171d; --side: #0b1f26; --side-ink: #d7e6ea; --side-muted: #7d9ba4; --side-on: #17343d;
  --surface: #182129; --bar: #222d36; --ink: #e4eaee; --muted: #97a6b2; --line: #28343e;
  --accent: #5db4c6; --on-accent: #08262e; --accent-soft: #15343d; --warn: #f0a53a; --warn-soft: #3a2a12;
  --bad: #ec7f7f; --bad-soft: #3b1e1f; --good: #74c66c; --good-soft: #17331f; --scrim: rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.4; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- estructura ---- */
.app { height: 100%; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 18px; padding-block: 20px 16px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: var(--f-display); font-size: 1.7rem; line-height: 1; color: var(--side-ink); }
.brand span { font-size: 13px; color: var(--side-muted); }
.navs { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.tab { background: none; border: 0; border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 10px; font-size: 15.5px; color: var(--side-ink); text-align: left; position: relative; }
.tab:hover { background: var(--side-on); }
.tab.on { background: var(--side-on); font-weight: 700; box-shadow: inset 3px 0 0 var(--side-ink); }
.tab .lbl { flex: 1; }
.tab .bd { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.tab.new { margin-top: 8px; background: var(--side-ink); color: var(--side); font-weight: 700; justify-content: center; }
.tab.new:hover { background: var(--side-ink); opacity: .92; }
.tab.new.on { box-shadow: none; }
.who { border-top: 1px solid var(--side-on); padding: 12px 8px 0; font-size: 13.5px; color: var(--side-muted); display: flex; flex-direction: column; gap: 2px; }
.who b { color: var(--side-ink); }
.main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 14px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; }
.top .tt { flex: 1; min-width: 0; }
.top h2 { font-family: var(--f-display); font-size: 1.9rem; line-height: 1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top small { color: var(--muted); font-size: 14px; }
.top .tb { display: flex; gap: 8px; align-items: center; }
.demo { font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
.content { flex: 1; overflow-y: auto; padding-block: 24px 40px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.wrapc { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; flex: none; }
.tb .txt { display: inline; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .side { order: 2; padding: 0; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); gap: 0; background: var(--surface); border-top: 1px solid var(--line); }
  .brand, .who { display: none; }
  .navs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; }
  .tab { flex-direction: column; gap: 2px; font-size: 12px; padding: 8px 2px 10px; border-radius: 0; color: var(--muted); align-items: center; }
  .tab:hover, .tab.on { background: none; box-shadow: none; }
  .tab.on { color: var(--accent); }
  .tab .lbl { flex: none; }
  .tab .bd { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; font-size: 11px; }
  .tab.new { margin: 0; background: none; color: var(--muted); }
  .tab.new svg { background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 4px; width: 30px; height: 30px; }
  .tab .full { display: none; }
  .top { padding-block: 12px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top h2 { font-size: 1.6rem; }
  .top small { font-size: 13px; }
  .tb .txt { display: none; }
  .content { padding-block: 14px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrapc { gap: 16px; }
}
@media (min-width: 821px) { .tab .short { display: none; } }

/* ---- componentes ---- */
h3.sec { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0; display: flex; justify-content: space-between; align-items: center; }
h3.sec.bad { color: var(--bad); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi:hover { border-color: var(--accent); }
.kpi b { font-family: var(--f-display); font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 14px; color: var(--muted); line-height: 1.2; }
.kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--warn); } .kpi.ok b { color: var(--good); }
.cols2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (max-width: 1050px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) { .kpis { grid-template-columns: 1fr 1fr; gap: 10px; } .kpi b { font-size: 2.1rem; } }
.list { display: flex; flex-direction: column; gap: 8px; }
.gridcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; width: 100%; cursor: pointer; }
.row:hover { border-color: var(--accent); }
.row.late { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
.row .when { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.row .when svg { color: var(--accent); }
.row .who2 { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .who2 b { font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .who2 span { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.sm { padding: 6px 10px; font-size: 13.5px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.st { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; padding: 1px 6px; border-radius: 4px; border: 1.5px solid currentColor; color: var(--accent); white-space: nowrap; background: none; }
.st.CAL { color: var(--warn); } .st.CAR, .st.EXCL { color: var(--good); } .st.NOC, .st.INH { color: var(--bad); } .st.PRO { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.chip .n { font-family: var(--f-mono); font-size: 11px; opacity: .8; }
@media (max-width: 820px) { .chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; } }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 7px 16px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 700; }
@media (max-width: 820px) { .seg { display: grid; } .seg button { padding: 7px 4px; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.toolbar .search { flex: 1 1 280px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
.search input { border: 0; background: none; padding: 9px 0; flex: 1; min-width: 0; outline: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; }
button.card:hover { border-color: var(--accent); }
.card .hd { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card .hd b { flex: 1; min-width: 0; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font-size: 13.5px; color: var(--muted); }
.next { font-size: 13.5px; display: flex; align-items: center; gap: 6px; color: var(--ink); }
.next.none, .next.late { color: var(--bad); }
.next.none { font-weight: 600; }
.alert { border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; background: var(--bad-soft); color: var(--ink); }
.alert svg { color: var(--bad); flex: none; margin-top: 1px; }
.alert.warn { background: var(--warn-soft); } .alert.warn svg { color: var(--warn); }
.alert .tx { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ph { border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); font-size: 14.5px; }
.sla { font-family: var(--f-mono); font-size: 11.5px; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.sla.ok { background: var(--good-soft); color: var(--good); } .sla.warn { background: var(--warn-soft); color: var(--warn); } .sla.bad { background: var(--bad-soft); color: var(--bad); }
.empty { text-align: center; color: var(--muted); padding: 18px; font-size: 14.5px; }
.phone-num { font-family: var(--f-mono); font-size: 13px; color: var(--muted); user-select: all; }

/* ---- ficha y alta por secciones ---- */
.fhead { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.fhead h4 { margin: 0; font-family: var(--f-display); font-size: 2rem; line-height: 1.05; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.fhead .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.dotst { width: 16px; height: 16px; border-radius: 50%; display: inline-block; background: var(--good); flex: none; }
.dotst.bad { background: var(--bad); }
.nextbar { border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--accent-soft); }
.nextbar .lb { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.nextbar .v { flex: 1; min-width: 220px; font-weight: 700; }
.nextbar .v span { font-weight: 400; color: var(--muted); }
.nextbar.bad { background: var(--bad-soft); }
.nextbar.bad .lb { color: var(--bad); }
.secs { display: flex; flex-direction: column; gap: 10px; }
.sbar { width: 100%; display: flex; align-items: center; gap: 12px; background: var(--bar); border: 0; border-radius: 8px; padding: 12px 16px; font-size: 15.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink); text-align: left; }
.sbar .chev { transition: transform .15s; flex: none; }
.sbar.closed .chev { transform: rotate(-90deg); }
.sbar .cnt { color: var(--muted); }
.sbody { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px; }
.kvrow { display: grid; grid-template-columns: 36px 190px minmax(0, 1fr); gap: 8px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); min-height: 54px; }
.kvrow:last-child { border-bottom: 0; }
.kvrow .k { color: var(--ink); }
.kvrow .v { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.kvrow .v .pr { font-weight: 400; font-style: italic; color: var(--muted); font-size: 13px; margin-left: 8px; }
.kvrow .v .sub { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.vbtn { background: none; border: 0; padding: 2px 0; text-align: left; font: inherit; color: inherit; border-bottom: 1px dotted transparent; }
.vbtn:hover { border-bottom-color: var(--muted); }
.vbtn.emptyv { color: var(--muted); font-weight: 600; }
.plus { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); background: none; display: grid; place-items: center; color: var(--ink); padding: 0; }
.plus:hover { border-color: var(--accent); color: var(--accent); }
.editbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 400; }
.editbox input, .editbox select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.editbox input[type="text"], .editbox input:not([type]) { flex: 1 1 180px; }
.editbox label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.rg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; padding: 14px 0; }
.rg h5 { margin: 0 0 8px; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
.rgtop { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.rgtop select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.ckl { display: flex; flex-direction: column; gap: 4px; }
.ckb { display: flex; gap: 10px; align-items: flex-start; background: none; border: 0; padding: 5px 0; font-size: 15px; text-align: left; color: var(--ink); }
.ckb:disabled { opacity: .5; cursor: not-allowed; }
.ck { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; background: var(--surface); }
.ck.on { background: var(--good); border-color: var(--good); color: var(--surface); }
.firma { border-top: 1px solid var(--line); padding: 12px 0; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; gap: 2px; }
.firma .mono { font-family: var(--f-mono); font-weight: 500; font-size: 12.5px; overflow-wrap: anywhere; }
.ftabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.ftabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-size: 15px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.ftabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.negacts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.negacts button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.negacts button:hover { border-color: var(--accent); }
.negacts b { font-size: 15px; display: flex; gap: 6px; align-items: center; }
.negacts b svg { color: var(--accent); }
.negacts span { font-size: 13px; color: var(--muted); }
@media (max-width: 700px) { .negacts { grid-template-columns: minmax(0, 1fr); } }
.tl { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.tl .ev { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding-bottom: 16px; position: relative; }
.tl .ev::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.tl .ev:last-child { padding-bottom: 0; }
.tl .ev:last-child::before { display: none; }
.tl .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); }
.tl .dot.sys { color: var(--muted); }
.tl .ev .tx { font-size: 15px; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.tl .ev .tx small { color: var(--muted); font-size: 12.5px; }
.nform { display: flex; flex-direction: column; gap: 10px; }
.nform .sbody { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld label, .fld .lb { font-size: 13px; font-weight: 600; color: var(--muted); }
.fld input, .fld select, .fld textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; }
.fld textarea { min-height: 84px; resize: vertical; }
.fld .cnt { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: right; }
.mrow { display: grid; grid-template-columns: 180px minmax(0, 1fr) 110px 190px 38px; gap: 8px; align-items: center; }
.mrow select, .mrow input { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-width: 0; width: 100%; }
.mrow label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; white-space: nowrap; }
.mhead { font-size: 13px; font-weight: 600; color: var(--muted); }
.dirblock { border: 1px dashed var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

function dupCheck() {
  const box = $('dup'); if (!box) return;
  const n = S.nuevo;
  const tels = n.medios.filter(m => isTel(m.tipo)).map(m => normTel(m.valor)).filter(t => t.length >= 9);
  const mails = n.medios.filter(m => !isTel(m.tipo)).map(m => m.valor.trim().toLowerCase()).filter(v => v.includes('@'));
  const dni = (n.tipo === 'Empresa' ? n.cif : n.dni).trim().toUpperCase();
  let hit = null, why = '';
  for (const c of S.clients) {
    if (tels.some(t => telsOf(c).includes(t))) { hit = c; why = 'mismo teléfono'; break; }
    if (mails.some(m => c.medios.some(x => x.valor.toLowerCase() === m))) { hit = c; why = 'mismo email'; break; }
    if (dni.length >= 8 && c.dni.toUpperCase() === dni) { hit = c; why = 'mismo DNI / CIF'; break; }
  }
  box.innerHTML = hit ? '<div class="alert warn">' + ic('alert') + '<div class="tx"><div><b>Este cliente ya existe (' + why + ')</b><br><span class="meta">' + esc(hit.nombre) + ' · ' + esc(telOf(hit)) + ' · ' + esc(stLabel(hit.estado)) + ' · ' + esc(uname(hit.owner)) + '</span></div><div><button class="btn sm pri" data-act="open" data-v="' + hit.id + '" type="button">Abrir su ficha</button></div></div></div>' : '';

function saveSheet() {
  const sh = S.sheet, c = client(sh.cid), f = sh.f;
  const changeState = () => {
    if (f.estado !== c.estado) {
      c.hist.push({ f: now(), t: 'sys', txt: 'Estado: ' + stLabel(c.estado) + ' → ' + stLabel(f.estado) + (f.motivo ? ' · Motivo: ' + f.motivo : ''), u: 'Tú' });
      c.estado = f.estado; c.motivo = f.motivo;
      c.sinSeg = false;
    }
  };
  const closeNoFollow = () => {
    pending(c.id).forEach(i => { i.done = true; });
    c.sinSeg = true;
    c.hist.push({ f: now(), t: 'sys', txt: c.estado === 'EXCL' ? 'Ex cliente guardado sin próxima acción' : 'Cerrado sin seguimiento: no se volverá a contactar' + (c.motivo ? ' · Motivo: ' + c.motivo : ''), u: 'Tú' });
  };
  if (sh.mode === 'reportar' && sh.close) {
    const done = sh.itemId ? S.items.find(i => i.id === sh.itemId) : nextOf(c.id);
    if (done) done.done = true;
    const parts = [TYPES[f.tipo].l, f.res]; if (f.res === 'Contactado' && f.tareas.length) parts.push(f.tareas.join(', '));
    c.hist.push({ f: now(), t: f.tipo, txt: parts.join(' · ') + (f.com.trim() ? ' — ' + f.com.trim() : ''), u: 'Tú' });
    changeState(); closeNoFollow();
    closeSheet(); toast('Reporte guardado. Cliente cerrado sin próxima acción'); render(); return;
  }
  if (sh.mode === 'estado') {
    changeState();
    if (c.estado === 'INH') S.items.forEach(i => { if (i.cid === c.id) i.done = true; });
    if (NO_FOLLOW.includes(c.estado) && f.recontacto === 'no') { closeNoFollow(); closeSheet(); toast('Estado actualizado. Guardado sin próxima acción'); render(); return; }
    if (c.estado === 'EXCL') { closeSheet(); render(); openSheet('planificar', c.id); toast('Estado actualizado. Elige cuándo hacer el seguimiento'); return; }
    if (c.estado === 'NOC') { pending(c.id).forEach(i => { i.done = true; }); S.items.push({ id: nid('i'), cid: c.id, tipo: 'llamada', f: D(90, 10), nota: 'Recuperación tras no compra', done: false }); c.hist.push({ f: now(), t: 'sys', txt: 'Planificado automáticamente: llamada de recuperación en 3 meses', u: 'Sistema' }); }
    closeSheet(); toast('Estado actualizado'); render(); return;
  }
  const d = whenDate(f);
  if (sh.mode === 'mover') {
    const it = S.items.find(i => i.id === sh.itemId);
    c.hist.push({ f: now(), t: 'sys', txt: 'Reprogramado: ' + TYPES[it.tipo].l + ' de ' + when(it.f) + ' a ' + when(d), u: 'Tú' });
    it.f = d; it.tipo = f.nTipo; it.nota = f.nNota;
    closeSheet(); toast('Acción movida a ' + when(d)); render(); return;
  }
  if (sh.mode === 'reportar') {
    const done = sh.itemId ? S.items.find(i => i.id === sh.itemId) : nextOf(c.id);
    if (done) done.done = true;
    const parts = [TYPES[f.tipo].l, f.res]; if (f.res === 'Contactado' && f.tareas.length) parts.push(f.tareas.join(', '));
    c.hist.push({ f: now(), t: f.tipo, txt: parts.join(' · ') + (f.com.trim() ? ' — ' + f.com.trim() : ''), u: 'Tú' });
    changeState();
  }
  if (c.sinSeg) { c.sinSeg = false; c.hist.push({ f: now(), t: 'sys', txt: 'Reabierto: vuelve al seguimiento comercial', u: 'Tú' }); }
  S.items.push({ id: nid('i'), cid: c.id, tipo: f.nTipo, f: d, nota: f.nNota, done: false });
  c.hist.push({ f: now(), t: 'sys', txt: 'Planificado: ' + TYPES[f.nTipo].l + ' · ' + when(d) + (f.nNota ? ' · ' + f.nNota : ''), u: 'Tú' });
  closeSheet(); toast(sh.mode === 'reportar' ? 'Reporte guardado. Siguiente: ' + when(d) : 'Planificado para ' + when(d)); render();
}

function saveUser() {
  const sh = S.sheet, f = sh.f, u = sh.uid ? user(sh.uid) : null, yo = me();
  const nombre = f.unom.trim(), email = f.uemail.trim().toLowerCase();
  if (!nombre) { toast('Falta el nombre', true); return; }
  if (!EMAIL_RE.test(email)) { toast('El email no es válido', true); return; }
  if (S.users.some(x => x.email.toLowerCase() === email && (!u || x.id !== u.id))) { toast('Ya hay un usuario con ese email', true); return; }
  if (u && !canEditUser(u)) { toast('No tienes permiso para editar este usuario', true); return; }
  const lead = f.urol === 'jefe' || f.urol === 'gerente';
  if (u && u.creador) { Object.assign(u, { nombre, email, sede: f.usede }); }
  else {
    const admin = yo.creador ? (lead && !!f.uadmin) : (u ? u.admin && lead : false);
    const activo = u && u.id === S.me ? true : !!f.uactivo;
    if (u && !activo && u.activo) {
      const own = S.clients.filter(c => c.owner === u.id);
      if (own.length && !f.ureasig) { toast('Elige a quién pasan sus clientes', true); return; }
      own.forEach(c => { c.owner = f.ureasig; c.ownerDesde = now(); c.hist.push({ f: now(), t: 'sys', txt: 'Reasignado de ' + u.nombre + ' a ' + uname(f.ureasig) + ' por baja del usuario', u: me().nombre }); });
      S.items.forEach(i => { if (!i.cid && i.resp === u.id) i.resp = f.ureasig; });
    }
    if (u) Object.assign(u, { nombre, email, rol: f.urol, sede: f.usede, admin, activo });
    else S.users.push({ id: nid('u'), nombre, email, rol: f.urol, sede: f.usede, admin, creador: false, activo: true });
  }
  closeSheet();
  if (S.verDe !== 'todos' && !(user(S.verDe) || {}).activo) S.verDe = 'todos';
  if (!canAdmin() && S.view === 'usuarios') { S.view = 'hoy'; S.prev = 'hoy'; }
  toast(u ? 'Usuario actualizado' : 'Usuario creado: ' + nombre);
  render();
}

  S.clients.push(c); S.nuevo = freshNuevo();
  openClient(c.id); openSheet('alta', c.id);
});

// ---------- dictado por voz ----------
// Usa el reconocimiento de voz del navegador (Chrome, Edge, Safari). Un botón de micrófono aparece
// dentro del campo de texto que tiene el foco; el texto dictado se inserta donde está el cursor.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC_SEL = 'textarea, input:not([type]), input[type="text"], input[type="search"]';
const MIC_HELP = 'En Windows también puedes pulsar Win + H para dictar en cualquier campo; en el móvil, usa el micrófono del teclado.';
let micField = null, micRec = null, micOn = false, micLast = '';

// ---------- ajustes (preferencias de este navegador) ----------
const CFG = { lang: 'es-ES', mic: true };
try { Object.assign(CFG, JSON.parse(localStorage.getItem('alfacrm-ajustes') || '{}')); } catch (e) { /* sin almacenamiento: valores por defecto */ }
const saveCfg = () => { try { localStorage.setItem('alfacrm-ajustes', JSON.stringify(CFG)); } catch (e) { /* no se guarda entre sesiones */ } };
const EMBEDDED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const FILEMODE = (() => { try { return window.location.protocol === 'file:'; } catch (e) { return false; } })();
// Motivo por el que el navegador no deja dictar aquí, o '' si el sitio es válido
const micBlockReason = () => EMBEDDED ? 'Estás viendo Alfa CRM dentro de Claude (página publicada o vista previa del archivo): ahí el micrófono está bloqueado siempre.'
  : FILEMODE ? 'Has abierto Alfa CRM como archivo del ordenador (la dirección empieza por file://): Chrome y Edge no permiten el dictado por voz en archivos, solo en direcciones web (https).' : '';
const LANGS = [['es-ES', 'Español (España)'], ['ca-ES', 'Català'], ['gl-ES', 'Galego'], ['eu-ES', 'Euskara'], ['en-GB', 'English']];
let MICPERM = 'desconocido';
async function refreshMicPerm() {
  try {
    if (typeof navigator !== 'undefined' && navigator.permissions && navigator.permissions.query) {
      const p = await navigator.permissions.query({ name: 'microphone' });
      MICPERM = p.state;
      p.onchange = () => { MICPERM = p.state; if (S.view === 'ajustes') renderContent(); };
    }
  } catch (e) { /* este navegador no deja consultar el permiso */ }
  if (S && S.view === 'ajustes') renderContent();
}
async function askMic() {
  if (typeof navigator === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { MICPERM = 'nosoportado'; renderContent(); toast('Este navegador no permite usar el micrófono desde la página.'); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    st.getTracks().forEach(t => t.stop());
    MICPERM = 'granted'; toast('Micrófono permitido. Ya puedes dictar.');
  } catch (e) {
    MICPERM = e && e.name === 'NotFoundError' ? 'sinmic' : 'denied';
    toast(MICPERM === 'sinmic' ? 'No se encuentra ningún micrófono conectado.' : 'El micrófono está bloqueado. Sigue los pasos de abajo para permitirlo.');
  }
  renderContent();
}
function vAjustes() {
  const est = {
    granted: ['ok', 'Permitido', 'El dictado por voz está listo.'],
    denied: ['bad', 'Bloqueado', 'El navegador no deja usar el micrófono en esta página. Sigue los pasos de abajo.'],
    prompt: ['warn', 'Sin decidir', 'Pulsa "Dar permiso al micrófono" y acepta el aviso del navegador.'],
    sinmic: ['bad', 'Sin micrófono', 'No se encuentra ningún micrófono conectado al equipo.'],
    nosoportado: ['bad', 'No disponible', 'Este navegador no permite usar el micrófono desde la página.'],
    desconocido: ['warn', 'Sin comprobar', 'Pulsa "Dar permiso al micrófono" para comprobarlo.']
  }[MICPERM] || ['warn', 'Sin comprobar', ''];
  let h = '<div class="cols2"><div class="stack">';
  h += '<div class="panel stack"><h3 class="sec">Tus datos</h3><p style="margin:0">' + (STORE_OK ? 'Todo lo que haces se guarda automáticamente <b>en este navegador</b>' + (LAST_SAVE ? ' (último guardado: ' + esc(when(LAST_SAVE)) + ')' : '') + '.' : '<b style="color:var(--bad)">Este navegador no permite guardar</b>: lo que hagas se perderá al cerrar. Descarga una copia antes de salir.') + '</p>' +
    '<ul class="tips"><li>Solo lo ves tú, en este dispositivo y este navegador: no se comparte con el equipo.</li><li>Si borras los datos de navegación o usas una ventana de incógnito, se pierde. Descarga una copia de vez en cuando.</li><li>No metas clientes reales en esta demostración. En la aplicación definitiva los datos se guardarán en un servidor y los verá el equipo según su rol.</li></ul>' +
    '<div class="chips"><button class="btn pri" data-act="xcopia" type="button">' + ic('download', 18) + 'Descargar copia de mis datos</button><button class="btn" data-act="dtab" data-v="imp" type="button">Restaurar una copia</button><button class="btn danger" data-act="reset" type="button">Borrar mis datos</button></div></div>';
  h += '<div class="panel stack"><h3 class="sec">Micrófono</h3>' +
    '<div class="toolbar"><span class="sla ' + est[0] + '" style="font-size:13px">' + est[1] + '</span><span>' + esc(est[2]) + '</span></div>' +
    (micBlockReason() ? '<div class="alert">' + ic('alert') + '<div class="tx"><b>Aquí el dictado del navegador no puede funcionar</b><span>' + esc(micBlockReason()) + '</span><span>Para dictar ahora mismo: pon el cursor en un campo y pulsa <b>Win + H</b> (Windows) o usa el micrófono del teclado del móvil. Para el botón de micrófono de Alfa CRM hace falta abrirlo desde una dirección web <b>https://</b>.</span></div></div>' : '') +
    '<div class="chips"><button class="btn pri" data-act="askmic" type="button">' + ic('mic', 18) + 'Dar permiso al micrófono</button><button class="btn" data-act="micperm" type="button">Volver a comprobar</button></div>' +
    '<p class="meta" style="margin:0">Dictado por voz en este navegador: <b>' + (SR ? 'disponible' : 'no disponible (usa Chrome o Edge)') + '</b></p></div>';
  h += '<div class="panel stack"><h3 class="sec">Dictado por voz</h3>' +
    '<label class="sw" for="g-mic">Mostrar el botón de micrófono en los campos de texto<input type="checkbox" id="g-mic" data-in="g.mic"' + (CFG.mic ? ' checked' : '') + '></label>' +
    '<div class="fld"><label for="g-lang">Idioma del dictado</label><select id="g-lang" data-in="g.lang">' + LANGS.map(l => '<option value="' + l[0] + '"' + (CFG.lang === l[0] ? ' selected' : '') + '>' + l[1] + '</option>').join('') + '</select></div>' +
    '<div class="fld"><label for="cfg-test">Prueba aquí: pulsa dentro y luego el micrófono</label><textarea id="cfg-test" rows="3" placeholder="Di, por ejemplo: quiere un híbrido coma entrega antes de Navidad punto"></textarea></div>' +
    '<p class="meta" style="margin:0">Órdenes: "punto", "coma", "dos puntos", "nueva línea", "punto y aparte" y "borrar". Estas preferencias se guardan en este navegador.</p></div>';
  h += '</div><div class="stack"><div class="panel stack"><h3 class="sec">Cómo dar permiso al micrófono</h3>' +
    '<details open><summary><b>Chrome o Edge en el ordenador</b></summary><ol class="tips"><li>Pulsa el icono que hay a la izquierda de la dirección de la página (un candado, una "i" o unos controles).</li><li>En <b>Micrófono</b>, elige <b>Permitir</b>.</li><li>Recarga la página con <b>F5</b>.</li><li>Si no aparece: escribe <span class="mono">chrome://settings/content/microphone</span> (o <span class="mono">edge://settings/content/microphone</span>) y quita la página de "No permitido".</li></ol></details>' +
    '<details><summary><b>Windows bloquea el micrófono</b></summary><ol class="tips"><li>Abre <b>Configuración → Privacidad y seguridad → Micrófono</b>.</li><li>Activa <b>Acceso al micrófono</b> y <b>Permitir que las aplicaciones de escritorio accedan al micrófono</b>.</li><li>Comprueba en <b>Sistema → Sonido</b> que el micrófono correcto es el de entrada.</li></ol></details>' +
    '<details><summary><b>Mac</b></summary><ol class="tips"><li>Abre <b>Ajustes del Sistema → Privacidad y seguridad → Micrófono</b>.</li><li>Activa <b>Google Chrome</b>, <b>Microsoft Edge</b> o <b>Safari</b>.</li></ol></details>' +
    '<details><summary><b>Móvil Android (Chrome)</b></summary><ol class="tips"><li>Toca los <b>tres puntos ⋮</b> y luego el icono <b>ⓘ</b> o <b>Configuración del sitio</b>.</li><li>En <b>Micrófono</b>, elige <b>Permitir</b>.</li><li>Si sigue bloqueado: <b>Ajustes del teléfono → Aplicaciones → Chrome → Permisos → Micrófono → Permitir</b>.</li></ol></details>' +
    '<details><summary><b>iPhone o iPad (Safari)</b></summary><ol class="tips"><li>Toca <b>aA</b> en la barra de dirección → <b>Ajustes del sitio web</b> → <b>Micrófono → Permitir</b>.</li><li>O en <b>Ajustes → Safari → Micrófono → Permitir</b>.</li><li>Comprueba que está activado <b>Ajustes → General → Teclado → Dictado</b>.</li></ol></details>' +
    '<details><summary><b>Sin dar permisos: dictado del sistema</b></summary><ul class="tips"><li><b>Windows:</b> pon el cursor en un campo y pulsa <b>Win + H</b>.</li><li><b>Móvil:</b> toca el <b>micrófono del teclado</b>.</li></ul></details>' +
    '</div><div class="alert warn">' + ic('info') + '<div class="tx">El dictado del navegador envía el audio a Google (Chrome) o Microsoft (Edge) para pasarlo a texto. No dictes datos sensibles de clientes hasta que el equipo decida el servicio definitivo.</div></div></div></div>';
  return h;
}
const micBtn = document.createElement('button');
micBtn.type = 'button'; micBtn.className = 'micfab'; micBtn.hidden = true;
micBtn.title = 'Dictar por voz: pulsa y habla'; micBtn.setAttribute('aria-label', 'Dictar por voz'); micBtn.setAttribute('aria-pressed', 'false');
micBtn.innerHTML = ic('mic', 18);
const micTip = document.createElement('div');
micTip.className = 'micbubble'; micTip.hidden = true; micTip.setAttribute('role', 'status');
document.body.append(micBtn, micTip);
const micTarget = () => { let el = micField; if (el && !document.body.contains(el) && el.id) el = document.getElementById(el.id); return el; };
function placeMic() {
  const el = micTarget();
  if (!el || !document.body.contains(el)) { if (!micOn) { micBtn.hidden = true; micTip.hidden = true; } return; }
  const r = el.getBoundingClientRect();
  if (!r.width) { micBtn.hidden = true; return; }
  micBtn.style.left = (r.right - 40) + 'px';
  micBtn.style.top = (el.tagName === 'TEXTAREA' ? r.top + 6 : r.top + (r.height - 34) / 2) + 'px';
  micBtn.hidden = false;
  micTip.style.left = Math.max(8, r.left) + 'px';
  micTip.style.top = (r.bottom + 6) + 'px';
}
function micInsert(el, txt) {
  const start = el.selectionStart != null ? el.selectionStart : el.value.length, end = el.selectionEnd != null ? el.selectionEnd : start;
  const before = el.value.slice(0, start);
  let t = txt;
  if (before && !/\s$/.test(before) && !/^[.,;:!?\n]/.test(t)) t = ' ' + t;
  if (!before.trim() || /[.!?]\s*$/.test(before) || /\n\s*$/.test(before)) t = t.replace(/^(\s*)(\p{L})/u, (m, a, b) => a + b.toUpperCase());
  if (el.maxLength > 0) t = t.slice(0, Math.max(0, el.maxLength - el.value.length + (end - start)));
  el.value = before + t + el.value.slice(end);
  const pos = before.length + t.length;
  try { el.setSelectionRange(pos, pos); } catch (e) { /* algunos tipos de campo no admiten cursor */ }
  micLast = t;
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
function micFinal(raw) {
  const el = micTarget(); if (!el) return;
  let t = raw.trim(); if (!t) return;
  if (/^borra(r)?( eso| lo último)?$/i.test(t)) {
    if (micLast && el.value.slice(0, el.selectionStart).endsWith(micLast)) { const p = el.selectionStart - micLast.length; el.value = el.value.slice(0, p) + el.value.slice(el.selectionStart); try { el.setSelectionRange(p, p); } catch (e) { } micLast = ''; el.dispatchEvent(new Event('input', { bubbles: true })); }
    return;
  }
  const multi = el.tagName === 'TEXTAREA';
  const whole = { 'punto': '.', 'coma': ',', 'punto y coma': ';', 'dos puntos': ':', 'nueva línea': multi ? '\n' : '. ', 'punto y aparte': multi ? '.\n' : '. ', 'interrogación': '?' };
  if (whole[t.toLowerCase()] !== undefined) { micInsert(el, whole[t.toLowerCase()]); return; }
  t = t.replace(/\s+(punto y aparte|nueva línea)$/i, multi ? '.\n' : '.').replace(/\s+punto$/i, '.').replace(/\s+coma$/i, ',');
  micInsert(el, t);
}
function startMic() {
  if (!SR) { toast('Este navegador no tiene dictado por voz (usa Chrome o Edge). ' + MIC_HELP, true); return; }
  if (!micTarget()) return;
  micRec = new SR();
  micRec.lang = CFG.lang || 'es-ES'; micRec.continuous = true; micRec.interimResults = true;
  micRec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) micFinal(r[0].transcript); else interim += r[0].transcript; }
    micTip.textContent = interim ? 'Escuchando: ' + interim : 'Escuchando… habla con normalidad';
    placeMic();
  };
  micRec.onerror = ev => {
    const m = { 'not-allowed': (micBlockReason() || 'El navegador tiene bloqueado el micrófono para esta página. En Ajustes tienes los pasos para permitirlo.') + ' Mientras tanto: ' + MIC_HELP, 'service-not-allowed': 'El dictado no está permitido en esta página. ' + MIC_HELP, 'no-speech': 'No te he oído. Pulsa el micrófono y vuelve a hablar.', 'network': 'El dictado necesita conexión a internet.', 'audio-capture': 'No se encuentra ningún micrófono conectado.' }[ev.error];
    if (m) toast(m, true);
  };
  micRec.onend = () => { micOn = false; micBtn.classList.remove('on'); micBtn.setAttribute('aria-pressed', 'false'); micTip.hidden = true; };
  try {
    micRec.start(); micOn = true; micLast = '';
    micBtn.classList.add('on'); micBtn.setAttribute('aria-pressed', 'true');
    micTip.textContent = 'Escuchando… habla con normalidad. Di "punto", "coma", "nueva línea" o "borrar".'; micTip.hidden = false; placeMic();
  } catch (e) { toast('No se ha podido iniciar el dictado. ' + MIC_HELP); }
}
function stopMic() { if (micRec) { try { micRec.stop(); } catch (e) { } } }
document.addEventListener('focusin', e => {
  const el = e.target;
  if (!CFG.mic || !el.matches || !el.matches(MIC_SEL) || el.readOnly || el.disabled) return;
  if (micField && micField !== el) { micField.classList.remove('micfield'); if (micOn) stopMic(); }
  micField = el; el.classList.add('micfield'); placeMic();
});
document.addEventListener('focusout', e => {
  if (e.target !== micField || micOn) return;
  setTimeout(() => { if (micField && document.activeElement !== micField && !micOn) { micField.classList.remove('micfield'); micField = null; micBtn.hidden = true; } }, 150);
});
window.addEventListener('scroll', placeMic, true);
window.addEventListener('resize', placeMic);
micBtn.addEventListener('mousedown', e => e.preventDefault());
micBtn.addEventListener('click', e => { e.stopPropagation(); if (micOn) stopMic(); else startMic(); });

// ---------- guardado automático en este navegador ----------
const DATA_KEY = 'alfacrm-datos-v1';
let STORE_OK = true, LAST_SAVE = null;
const savedTxt = () => STORE_OK ? (LAST_SAVE ? 'Guardado ' + hm(LAST_SAVE) : 'Guardado automático') : 'Sin guardar';
function persist() {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify({ v: 2, savedAt: new Date().toISOString(), uid, clients: S.clients, items: S.items, leads: S.leads, users: S.users, me: S.me }));
    STORE_OK = true; LAST_SAVE = new Date();
  } catch (e) { STORE_OK = false; }
  const el = document.getElementById('savedind');
  if (el) { el.textContent = savedTxt(); el.className = 'savedind' + (STORE_OK ? '' : ' bad'); }
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(DATA_KEY);
    if (!raw) return false;
    const o = JSON.parse(raw);
    if (!o || (o.v !== 1 && o.v !== 2) || !Array.isArray(o.clients)) return false;
    const b = reviveBackup({ clientes: o.clients, agenda: o.items || [], leads: o.leads || [] });
    S.clients = b.clientes; S.items = b.agenda; S.leads = b.leads;
    if (Array.isArray(o.users) && o.users.filter(u => u.creador).length === 1) S.users = o.users;
    S.clients.forEach(c => { c.owner = LEGACY_OWNERS[c.owner] || c.owner; });
    S.items.forEach(i => { if (i.resp) i.resp = LEGACY_OWNERS[i.resp] || i.resp; });
    if (o.me && user(o.me) && user(o.me).activo) S.me = o.me;
    uid = Math.max(uid, +o.uid || 0);
    LAST_SAVE = new Date(o.savedAt);
    return true;
  } catch (e) { return false; }
}

seed();
const restored = loadSaved();
render();
if (restored) toast('Recuperados tus datos guardados en este navegador');
else if (!STORE_OK) toast('Este navegador no permite guardar datos: lo que hagas se perderá al cerrar. Descarga una copia en Ajustes.', true);
setInterval(() => { if (!S.sheet && !S.edit && (S.view === 'leads' || S.view === 'hoy')) { const st = $('content').scrollTop; renderContent(); renderTabs(); $('content').scrollTop = st; } }, 60000);
})();
</script>
